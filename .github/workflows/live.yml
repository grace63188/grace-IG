name: 更新 IG直播 時間

on:
  schedule:
    # 每小時第 13 分（UTC）；GitHub 排程可能延遲數分鐘至數十分鐘
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 與 podcast.yml 共用同一組，避免兩個排程同時 push 造成衝突
concurrency:
  group: grace-ig-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 隱私：只取標題為「IG直播」的行程；此 repo 與執行紀錄皆公開，腳本不印網址與其他行程任何資訊
      - name: 讀取行事曆並更新 data/live.json
        env:
          LIVE_ICS_URL: ${{ secrets.LIVE_ICS_URL }}
        run: node scripts/update_live.mjs

      - name: 有變更才 commit 並 push
        run: |
          if [ -z "$(git status --porcelain -- data/live.json)" ]; then
            echo "data/live.json 無變更，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -q -m "更新 IG直播 時間"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 失敗，第 ${i} 次重試…"
            sleep $((i * 5))
          done
          echo "::error::push 失敗（已重試 3 次）"
          exit 1
