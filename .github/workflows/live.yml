name: 更新 IG直播 時間

on:
  schedule:
    # 每月 26 日 UTC 15:00 = 台北 23:00；載入本月剩餘＋下個月整月
    # GitHub 排程可能延遲數分鐘至數十分鐘
    - cron: '0 15 26 * *'
  workflow_dispatch:
    inputs:
      diag:
        description: '診斷模式（1＝印出隱私安全的計數與結構資訊；不印標題、網址）'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']

permissions:
  contents: write

# 與 podcast.yml 共用同一組，避免兩個排程同時 push 造成衝突
concurrency:
  group: grace-ig-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 隱私：只取標題為「IG直播」的行程；此 repo 與執行紀錄皆公開，腳本不印網址與其他行程任何資訊
      - name: 讀取行事曆並更新 data/live.json
        env:
          LIVE_ICS_URL: ${{ secrets.LIVE_ICS_URL }}
          DIAG: ${{ github.event_name == 'workflow_dispatch' && inputs.diag || '0' }}
        run: node scripts/update_live.mjs

      - name: 有變更才 commit 並 push
        run: |
          if [ -z "$(git status --porcelain -- data/live.json)" ]; then
            echo "data/live.json 無變更，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -q -m "更新 IG直播 時間"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 失敗，第 ${i} 次重試…"
            sleep $((i * 5))
          done
          echo "::error::push 失敗（已重試 3 次）"
          exit 1
