name: 更新 PODCAST 最新一集

on:
  schedule:
    # 每天 UTC 22:07 = 台北時間 06:07（GitHub 排程可能延遲數分鐘至數十分鐘）
    - cron: '7 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 與 live.yml 共用同一組，避免兩個排程同時 push 造成衝突
concurrency:
  group: grace-ig-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 取得最新一集並更新 data/podcast.json
        run: node scripts/diag_podcast.mjs

