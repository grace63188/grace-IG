name: 更新 PODCAST 最新一集

on:
  schedule:
    # 每小時第 17 分檢查一次（GitHub 排程可能延遲數分鐘至數十分鐘）；內容沒變不會 commit
    # 原本每天只跑一次（台北 06:07），新集數在白天上架就要等到隔天早上才會出現在首頁
    - cron: '17 * * * *'
  # 手動執行：Actions → 更新 PODCAST 最新一集 → Run workflow
  workflow_dispatch:

permissions:
  contents: write

# 與 live.yml 共用同一組，避免兩個排程同時 push 造成衝突
concurrency:
  group: grace-ig-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 取得最新一集並更新 data/podcast.json
        run: node scripts/update_podcast.mjs

      - name: 有變更才 commit 並 push
        run: |
          if [ -z "$(git status --porcelain -- data/podcast.json)" ]; then
            echo "data/podcast.json 無變更，不 commit。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcast.json
          git commit -m "chore(data): 更新 PODCAST 最新一集"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 失敗，第 ${i} 次重試…"
            sleep $((i * 5))
          done
          echo "::error::push 失敗（已重試 3 次）"
          exit 1
